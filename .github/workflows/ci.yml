name: CI

# Gates every pull request. This exists because PR #4 shipped a server whose
# build failed in a way `pnpm typecheck` could not see: `tsc -p
# tsconfig.build.json` exited 2 while `tsc --noEmit` passed. The build is part
# of the gate from here on.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # Version comes from package.json `packageManager` (pnpm@11.10.0).
          # Specifying it here too makes the action refuse to run.
          run_install: false

      - name: Get pnpm store directory
        id: store
        shell: bash
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The build was the silent blocker: it must be part of the gate, not
      # discovered at packaging time. `better-sqlite3` is native, so this also
      # proves the install and allowBuilds config works on a clean checkout.
      - name: Build
        run: pnpm build

      - name: Boot the built server and probe it
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/takalif-ci
          DB_FILE=/tmp/takalif-ci/ci.sqlite PORT=8799 HOST=127.0.0.1 node packages/server/dist/index.js &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8799/api/health >/dev/null 2>&1; then break; fi
            sleep 0.5
          done

          echo "-- health --"
          curl -fsS http://127.0.0.1:8799/api/health

          echo ""
          echo "-- create a rule, expect 201 --"
          CODE=$(curl -s -o /tmp/takalif-ci/rule.json -w '%{http_code}' \
            -X POST http://127.0.0.1:8799/api/rules \
            -H 'content-type: application/json' \
            -d '{"title":"CI Workout","rrule":"FREQ=DAILY"}')
          test "$CODE" = "201" || { cat /tmp/takalif-ci/rule.json; exit 1; }
          echo "created: $(cat /tmp/takalif-ci/rule.json)"

          echo "-- day view, expect one pending item --"
          curl -fsS http://127.0.0.1:8799/api/day

  docker:
    name: Docker build and boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gates the packaging files the way `Build` gates the bundles: a bare
      # `node_modules` in .dockerignore once shipped absolute host symlinks
      # into the image, which no typecheck could see.
      #
      # Retried with backoff: shared runners periodically hit Docker Hub
      # 429s resolving node:22-slim, which is environmental rather than a
      # repo fault, and a single attempt would red otherwise-green PRs.
      - name: Build image
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            if docker build -t takalif:ci .; then break; fi
            echo "docker build attempt $i failed; backing off before retry"
            sleep $((i * 60))
            if [ "$i" = 5 ]; then exit 1; fi
          done

      - name: Boot and probe
        shell: bash
        run: |
          set -e
          docker run -d --name takalif-ci -p 8798:8787 \
            -e HOST=0.0.0.0 -e DB_FILE=/data/ci.sqlite takalif:ci
          trap 'docker rm -f takalif-ci >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8798/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done

          echo "-- health --"
          curl -fsS http://127.0.0.1:8798/api/health

          echo ""
          echo "-- create a rule, expect 201 --"
          # The container binds off-loopback, so its gateway IP is not
          # loopback from the server's view: every call but /health needs the
          # pairing token the boot prints. Same reason a phone needs pairing.
          TOKEN=$(docker logs takalif-ci 2>&1 | grep -oP 'pairing token: \K[0-9a-f]{64}' | head -1)
          test -n "$TOKEN" || { echo "no pairing token in boot logs"; docker logs takalif-ci; exit 1; }
          AUTH="Authorization: Bearer $TOKEN"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:8798/api/rules \
            -H 'content-type: application/json' \
            -H "$AUTH" \
            -d '{"title":"CI Docker","rrule":"FREQ=DAILY"}')
          test "$CODE" = "201"

          echo "-- csv export, expect a header --"
          curl -fsS -H "$AUTH" 'http://127.0.0.1:8798/api/export/csv?from=2026-01-01&to=2026-12-31' \
            | head -1 | grep -q '^rule_id,'

  companion:
    name: Companion debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        id: store
        shell: bash
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      # AGP 8.13 + Gradle 8.14 run on 21; matches the local toolchain (JDK 21).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Installs cmdline-tools, accepts SDK licenses, sets ANDROID_HOME.
      # compileSdk/targetSdk 36 (variables.gradle): the platform and
      # build-tools arrive via AGP auto-download against the accepted
      # licenses, so no revision string is pinned here.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The companion bakes ../web/dist (webDir in capacitor.config.ts),
      # so the bundle must exist before the sync below.
      - name: Build web bundle
        run: pnpm build

      # Copies the bundle into the native shell and regenerates the
      # scanner-plugin bridge (gitignored locally, rebuilt here).
      - name: Sync Capacitor shell
        run: pnpm --filter @takalif/companion exec cap sync android

      - name: Assemble debug APK
        shell: bash
        run: |
          chmod +x packages/companion/android/gradlew
          cd packages/companion/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: takalif-companion-debug
          path: packages/companion/android/app/build/outputs/apk/debug/app-debug.apk
